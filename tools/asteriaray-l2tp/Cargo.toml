[package]
name = "asteriaray-l2tp"
version = "0.1.0"
edition = "2021"
description = "Standalone userspace L2TP/IPsec VPN client daemon for AsteriaRay"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tun2 = { version = "4.0", features = ["async"] }
aes = "0.8"
cbc = "0.1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
md4 = "0.10"
hmac = "0.12"
num-bigint = { version = "0.4", features = ["rand"] }
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
